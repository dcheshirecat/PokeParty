<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#11132a">
  <title>Pokémon Journey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <!-- Menu screens render into #main -->
  <section id="main" class="screen active" aria-live="polite"></section>

  <!-- Battle screen (persistent DOM so animations can run) -->
  <section id="battle" class="screen">
    <div id="arena" class="arena">
      <div class="arena-sky"></div>
      <div class="arena-ground"></div>
      <div class="arena-top">
        <span id="b-place" class="b-place"></span>
        <button id="b-speed" class="b-speed" aria-label="Battle speed">▶</button>
      </div>
      <div id="b-trainer" class="trainer-pic"><img alt=""><span class="tp-emoji"></span></div>
      <div id="b-info-e" class="info info-e"></div>
      <div class="plat plat-e"></div>
      <div id="b-spr-e" class="spr spr-e gone"><img id="b-img-e" alt=""></div>
      <div class="plat plat-p"></div>
      <div id="b-spr-p" class="spr spr-p gone"><img id="b-img-p" alt=""></div>
      <div id="b-info-p" class="info info-p"></div>
      <div id="b-ball" class="ball-fx"></div>
    </div>
    <div id="b-text" class="textbox"><span id="b-text-inner"></span><i class="tb-arrow"></i></div>
    <div id="b-panel" class="b-panel locked"></div>
    <div id="b-result" class="b-result"></div>
  </section>

  <nav id="tabbar" class="tabbar hidden">
    <button class="tab" data-act="go" data-arg="explore"><span>🗺️</span>Explore</button>
    <button class="tab" data-act="go" data-arg="team"><span>🎒</span>Team</button>
    <button class="tab" data-act="go" data-arg="gyms"><span>🏟️</span>Gyms</button>
    <button class="tab" data-act="go" data-arg="shop"><span>🛒</span>Shop</button>
    <button class="tab" data-act="go" data-arg="dex"><span>📖</span>Dex</button>
    <button class="tab" data-act="go" data-arg="more"><span>☰</span>More</button>
  </nav>
</div>

<div id="layers"></div>
<div id="toasts"></div>
<div id="loading"><div class="spinner"></div><div id="loading-text">Loading…</div></div>

<!-- Load order matters: data → services → engine → state → UI → features → boot -->
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/state.js"></script>
<script src="js/factory.js"></script>
<script src="js/battle.js"></script>
<script src="js/screens/home.js"></script>
<script src="js/screens/team.js"></script>
<script src="js/screens/shop.js"></script>
<script src="js/screens/dex.js"></script>
<script src="js/screens/gyms.js"></script>
<script src="js/screens/more.js"></script>
<script src="js/main.js"></script>
</body>
</html>
